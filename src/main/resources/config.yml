# GriefAllow Configuration
# Plugin that allows griefing mechanics in specified worlds and regions
#
# IMPORTANT:
# Outside of the configured scope the plugin does NOTHING.
# It does not protect, does not cancel, does not override.
# It only ALLOWS griefing inside whitelisted areas
# (or outside blacklisted ones). Everything else is left to
# vanilla behaviour and to other plugins.

# Debug mode - enables detailed logging for troubleshooting
debug: false

# ==================== GRIEFING MECHANICS ====================

# TNT Settings
# Allow TNT to explode and destroy blocks
enable-tnt: true

# What to do with TNT blocks caught in an explosion's block list:
#
#   ACTIVATE - ignite the TNT so it becomes a primed TNT entity,
#              exactly like vanilla chain reactions.
#   DESTROY  - break the block naturally, dropping an item.
#   NOTHING  - leave the TNT block untouched.
tnt-action: DESTROY

# How the fuse of a freshly activated TNT is computed:
#
#   primitive - always 80 ticks (4 seconds), like an item ignited by
#               flint and steel or redstone.
#   smart     - vanilla chain reaction formula:
#               random(0 .. 80/4) + 80/8 => 10..30 ticks.
tnt-mode: smart

# Multiplier applied to the vanilla explosion yield of every processed
# explosion. Final yield = vanillaYield * multiplier.
#
#   1.0        - standard, vanilla strength (default)
#   0.5        - half strength
#   0.13523526 - very weak explosion
#   1000       - extremely powerful
#
# The base yield depends on the source entity type, so different
# explosion sources keep their relative strength (Creeper vs TNT vs
# Ghast fireball, etc.) but scale consistently with this multiplier.
explosion-yield-multiplier: 1.0

# Piston Settings
# Allow pistons to push and pull blocks
enable-pistons: true

# Wither Settings
# Allow Wither boss to break blocks and deal damage
enable-wither: true

# Falling Block Settings
# Allow sand, gravel, and anvils to fall
enable-sand: true

# Minecart Hopper Settings
# Allow minecart hoppers to transfer items between inventories
enable-minecart: true

# Spawn Egg Settings
# Allow mob spawn eggs to be used on blocks
enable-egg-spawn: true

# Vehicle Settings
# Allow players to destroy minecarts and boats
enable-vehicle-destroy: true

# Fluid Settings
# Allow water and lava to flow freely and destroy blocks
enable-fluid-flow: true

# Fishing Rod Settings
# Allow players to pull minecarts with a fishing rod
enable-fishing-minecart: true

# ==================== EXPLOSION TYPES ====================
# Only explosions whose source entity type is listed here will be
# handled by the plugin. Everything else is left completely untouched,
# so it keeps its vanilla behaviour.
#
# This is important for Wind Charge and Breeze, which in vanilla do
# NOT break blocks. Leave them commented out unless you explicitly
# want them to grief terrain.
#
# Uncomment a line to let the plugin process that explosion type.
# Comment out a line to leave that explosion type to vanilla.

explosion-types:
  - TNT
  - TNT_MINECART
  - ENDER_CRYSTAL
  
  - CREEPER
  - WITHER
  - WITHER_SKULL

  # - GHAST
  # - FIREBALL
  # - SMALL_FIREBALL
  # - DRAGON_FIREBALL
  # - WIND_CHARGE
  # - BREEZE_WIND_CHARGE
  # - BREEZE


# ==================== WORLD FILTERING ====================

# World filtering type:
# whitelist - plugin will ONLY work in the worlds listed below
# blacklist - plugin will NOT work in the worlds listed below (default)
# disable - plugin will work in ALL worlds regardless
worlds-type: blacklist

# List of worlds for whitelist/blacklist filtering
worlds:
  - spawn
  - lobby

# ==================== REGION PROTECTION ====================

# Region filtering type:
# whitelist - plugin will ONLY work inside the regions defined below
# blacklist - plugin will NOT work inside the regions defined below
# disable - plugin will work regardless of regions (default)
regions-type: disable

# Protected regions defined as cuboid areas
# Each region requires:
#   world: World name where the region is located
#   x1, y1, z1: First corner coordinates
#   x2, y2, z2: Second corner coordinates
regions:
  region1:
    world: world
    x1: 100
    y1: 0
    z1: 100
    x2: 200
    y2: 256
    z2: 200
  region2:
    world: world_nether
    x1: -50
    y1: 0
    z1: -50
    x2: 50
    y2: 128
    z2: 50
